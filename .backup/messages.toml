text = """
抽取辅助天赋·三选一
请回复1~3选择一项；未选中的天赋也不会回到天赋池。
1. 反斩杀回复：无论何时，你的单体治疗效果将使目标免收因为生命值低下而受到的额外伤害。
2. 精美烧鹅：每一次跑团开始时，你会获得3只可以自由分享的美味烧鹅，与其他食物不同，纵使是重伤甚至濒死状态它依旧能提供自然回复效果，使用烧鹅时无法进行其他动作，需要引导5回合，每回合回复20%的最大生命/魔法值，自然回复效果不受治疗减免影响。引导中断或结束烧鹅就会消失。
3. 生死时速：无论何时,你对濒死的目标提高50%的治疗效果。"""

