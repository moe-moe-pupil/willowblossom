[[messages.2704372961.message]]
type = "text"

[messages.2704372961.message.data]
text = """
玩家命令帮助
命令前缀可混用半角【.】或全角【。】，例如 .help / 。help。
【.兑换】开始创建角色
【.状态】查看角色当前状态
【.属性说明】查看八项属性的完整说明
【.魔网】或【.weave】感知魔网
【.侦测魔法】或【.detect magic】侦测附近的施法痕迹（需要INT 20）
【.已兑换】查看技能与兑换内容
【.冷却】查看技能冷却
【.频道】查看自己所属的全部频道
【.频道人员】查看当前可见频道成员
【.指南】查看当前TRPG组指南
【.观察】或【.gc】请求玩家观察画面；【.观察视频】或【.gc2】请求360度观察视频
【.抽取天赋】抽取普通天赋（三选一）
【.抽取辅助天赋】抽取辅助天赋（三选一，经验获取+15%）
【.<属性> <点数>】为已完成角色投入属性点，例如 .力量 1 或 。agi 2
建卡过程中：【.】下一步，【..】上一步；属性阶段直接发送数字。"""

