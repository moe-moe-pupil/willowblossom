1. 蝴蝶效应：每一次跑团开始时，你将可以指定一个目标，使他获得5%的伤害加成和5%的伤害减免，持续一回合，然后在一回合后转移此效果给你，之后再转移给他，如此反复。
2. 跃动之火：无论何时，每当你移动时，你会发出璀璨的亮光，并且提高自身10%的最大生命上限，停止移动后加成消失。
3. 寰宇之视：无论何时，你都能获得最后一个受到你治疗效果的目标的大致位置。"""

