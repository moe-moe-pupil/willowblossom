text = """
职业:政委（3分）
政委是帝国卫队中最具标志性的角色——头戴大檐帽、身披长外套，手持动力剑与爆弹手枪。他们既是战场上的执法者，有权立即处决任何怯懦的士兵，也是冲锋在前的精神领袖。
职业技能:
战吼—为了帝皇:使目标下次攻击伤害+x（数值主神定）

装备
链锯剑（6分）
由机械教加持的加强版链锯剑，锯齿采用更坚硬的合金。
特性:撕裂 命中目标造成流血效果

爆失枪（1分）
帝国最标志性的单兵武器。它发射的 .75 口径爆弹，本质是一枚自带火箭发动机的小型穿甲导弹

"""

